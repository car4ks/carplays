    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1024px;
            height: 512px;
            background-color: #000;
            overflow: hidden;
        }
        @font-face {
            font-family: 'AvionicWideHeavy';
            src: url('local://local/vehicles/sdd_g82/Screen/AvionicWideHeavy-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        .mode-bar {
            fill: #ff0000;
            stroke: none;
        }
        .mode-bar-inactive {
            fill: #333333;
            stroke: none;
        }
        .g-force-container {
            position: absolute;
            top: 212px;
            left: 110px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }
        .g-force-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .g-force-grid-line-h {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: rgba(255, 255, 255, 0.2);
        }
        .g-force-grid-line-v {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.2);
        }
        .g-force-marker {
            position: absolute;
            width: 12px;
            height: 12px;
            margin-left: -6px;
            margin-top: -6px;
            background-color: #fff;
            border-radius: 50%;
            z-index: 10;
            top: 50%;
            left: 50%;
        }
        #g-force-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .g-force-label {
            position: absolute;
            color: #fff;
            font-size: 16px;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .g-force-label-x-pos {
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
        }
        .g-force-label-x-neg {
            left: 4px;
            top: 50%;
            transform: translateY(-50%);
        }
        .g-force-label-y-pos {
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
        }
        .g-force-label-y-neg {
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>

    <script>
        let unit = "metric"; // Default to metric, like ESBR

        const leftGreyFill = document.getElementById('leftGreyFill');
        const rightGreyFill = document.getElementById('rightGreyFill');
        const leftRedBar = document.getElementById('leftRedBar');
        const rightRedBar = document.getElementById('rightRedBar');
        const leftRedFadeAbove = document.getElementById('leftRedFadeAbove');
        const rightRedFadeAbove = document.getElementById('rightRedFadeAbove');
        const gearDisplayLetter = document.getElementById('gearDisplayLetter');
        const gearDisplayNumber = document.getElementById('gearDisplayNumber');
        const gearDisplaySingle = document.getElementById('gearDisplaySingle');
        const specialGearGroup = document.getElementById('specialGearGroup');
        const speedDisplay = document.getElementById('speedDisplay');
        const speedUnit = document.getElementById('speedUnit');
        const speedLimitDisplay = document.getElementById('speedLimitDisplay');
        const timeDisplay = document.getElementById('text17').querySelector('tspan');
        const tempDisplay = document.getElementById('text18').querySelector('tspan');
        const transferCaseDisplay = document.getElementById('text19').querySelector('tspan');
        
        // Indicator elements
        const leftTurnSignal = document.getElementById('leftTurnSignal');
        const rightTurnSignal = document.getElementById('rightTurnSignal');
        const headlights = document.getElementById('headlights');
        const highBeams = document.getElementById('highBeams');
        const checkEngine = document.getElementById('checkEngine');
        
        const modes = {
            engine: { element: document.getElementById('engineModeText'), bars: [document.getElementById('engine-bar1'), document.getElementById('engine-bar2'), document.getElementById('engine-bar3')], maxLevel: 3 },
            suspension: { element: document.getElementById('suspensionModeText'), bars: [document.getElementById('suspension-bar1'), document.getElementById('suspension-bar2'), document.getElementById('suspension-bar3')], maxLevel: 3 },
            steering: { element: document.getElementById('steeringModeText'), bars: [document.getElementById('steering-bar1'), document.getElementById('steering-bar2')], maxLevel: 2 },
            brake: { element: document.getElementById('brakeModeText'), bars: [document.getElementById('brake-bar1'), document.getElementById('brake-bar2')], maxLevel: 2 }
        };
        
        const maxRpmHeight = 240;
        const fadeHeight = 50;
        const MODE_NAMES = { comfort: 'COMFORT', ttSport: 'SPORT', 'ttSport+': 'SPORT+' };
        const MODE_LEVELS = { comfort: 1, ttSport: 2, 'ttSport+': 3 };

        function updateRpmGauges(percentage) {
            const height = (percentage / 100) * maxRpmHeight;
            const greyHeight = height - 12;
            leftGreyFill.setAttribute('height', greyHeight > 0 ? greyHeight : 0);
            leftGreyFill.setAttribute('y', 420 - height > 0 ? 420 - height + 12 : 420);
            rightGreyFill.setAttribute('height', greyHeight > 0 ? greyHeight : 0);
            rightGreyFill.setAttribute('y', 420 - height > 0 ? 420 - height + 12 : 420);
            const redHeight = 12;
            const redY = 420 - height > 0 ? 420 - height : 420;
            leftRedBar.setAttribute('height', redHeight);
            leftRedBar.setAttribute('y', redY);
            rightRedBar.setAttribute('height', redHeight);
            rightRedBar.setAttribute('y', redY);
            const fadeY = (420 - height) - fadeHeight;
            leftRedFadeAbove.setAttribute('height', fadeHeight);
            leftRedFadeAbove.setAttribute('y', fadeY);
            rightRedFadeAbove.setAttribute('height', fadeHeight);
            rightRedFadeAbove.setAttribute('y', fadeY);
        }

        function updateGear(gear) {
            if (typeof gear === 'string' && gear.length === 2) {
                const letter = gear.charAt(0);
                const number = gear.charAt(1);
                if ((letter === 'S' || letter === 'M') && !isNaN(number)) {
                    specialGearGroup.style.visibility = 'visible';
                    gearDisplaySingle.textContent = '';
                    gearDisplayLetter.textContent = letter;
                    gearDisplayNumber.textContent = number;
                    gearDisplayLetter.setAttribute('x', letter === 'M' ? '4' : '4');
                    return;
                }
            }
            let displayText;
            if (gear === 0) displayText = 'N';
            else if (gear === -1) displayText = 'R';
            else if (gear === -2) displayText = 'P';
            else displayText = gear.toString();
            specialGearGroup.style.visibility = 'hidden';
            gearDisplaySingle.textContent = displayText;
        }

        function updateSpeed(speed) {
            const speedValue = Math.round(unit === "metric" ? speed * 3.6 : speed * 2.23694); // km/h or mph
            speedDisplay.textContent = speedValue;
            speedUnit.textContent = unit === "metric" ? 'km/h' : 'mph';
        }

        function updateSpeedLimit(speedLimit) {
            if (speedLimit == null || speedLimit <= 0) {
                speedLimitDisplay.textContent = 'N/A';
            } else {
                const speedLimitValue = Math.round(unit === "metric" ? speedLimit : speedLimit * 0.621371); // km/h to mph if imperial
                speedLimitDisplay.textContent = speedLimitValue;
            }
        }
        
        function updateMode(system, modeName) {
            let level = MODE_LEVELS[modeName] || 1;
            let displayName = MODE_NAMES[modeName] || 'COMFORT';
            level = Math.min(level, modes[system].maxLevel);
            modes[system].element.textContent = displayName;
            modes[system].bars.forEach(bar => bar.setAttribute('class', 'mode-bar-inactive'));
            for (let i = 0; i < level; i++) {
                if (modes[system].bars[i]) modes[system].bars[i].setAttribute('class', 'mode-bar');
            }
        }

        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            timeDisplay.textContent = `${hours}:${minutes} ${ampm}`;
        }

        function updateOutsideTemp(temp) {
            tempDisplay.textContent = temp >= 0 ? `+${temp.toFixed(1)}` : temp.toFixed(1);
        }

        function updateTransferCase(state) {
            transferCaseDisplay.textContent = state === 1 ? '2WD' : '4WD';
        }

        function updateIndicators(data) {
            leftTurnSignal.style.visibility = data.signal_L === 1 ? 'visible' : 'hidden';
            rightTurnSignal.style.visibility = data.signal_R === 1 ? 'visible' : 'hidden';
            headlights.style.visibility = data.lights_state > 0 ? 'visible' : 'hidden';
            highBeams.style.visibility = data.highbeam === 1 ? 'visible' : 'hidden';
            checkEngine.style.visibility = data.checkengine === 1 ? 'visible' : 'hidden';
        }

        const gForceMarker = document.getElementById('g-force-marker');
        const gXPos = document.getElementById('g-x-pos');
        const gXNeg = document.getElementById('g-x-neg');
        const gYPos = document.getElementById('g-y-pos');
        const gYNeg = document.getElementById('g-y-neg');
        const gForceCanvas = document.getElementById('g-force-canvas');
        const ctx = gForceCanvas.getContext('2d');
        
        const canvasSize = 140;
        const centerX = canvasSize / 2;
        const centerY = canvasSize / 2;
        const maxGForce = 1.5;
        const trailMaxAge = 1000;
        const trailPoints = [];
        let lastGForceX = 0;
        let lastGForceY = 0;
        
        function updateGForceMeter(gForceX, gForceY) {
            gForceX = Math.max(Math.min(gForceX, maxGForce), -maxGForce);
            gForceY = Math.max(Math.min(gForceY, maxGForce), -maxGForce);
            const scale = (canvasSize / 2) / maxGForce;
            const markerX = centerX + (gForceX * scale);
            const markerY = centerY - (gForceY * scale);
            gForceMarker.style.left = `${markerX}px`;
            gForceMarker.style.top = `${markerY}px`;
            const roundedGX = Math.abs(gForceX).toFixed(1);
            const roundedGY = Math.abs(gForceY).toFixed(1);
            gXPos.textContent = gForceX > 0 ? roundedGX : '0';
            gXNeg.textContent = gForceX < 0 ? roundedGX : '0';
            gYPos.textContent = gForceY > 0 ? roundedGY : '0';
            gYNeg.textContent = gForceY < 0 ? roundedGY : '0';
            const now = Date.now();
            trailPoints.push({
                x: markerX,
                y: markerY,
                timestamp: now,
                prevX: lastGForceX === 0 ? markerX : centerX + (lastGForceX * scale),
                prevY: lastGForceY === 0 ? markerY : centerY - (lastGForceY * scale)
            });
            lastGForceX = gForceX;
            lastGForceY = gForceY;
            while (trailPoints.length > 0 && now - trailPoints[0].timestamp > trailMaxAge) {
                trailPoints.shift();
            }
            drawTrails();
        }
        
        function drawTrails() {
            ctx.clearRect(0, 0, canvasSize, canvasSize);
            const now = Date.now();
            for (let i = 0; i < trailPoints.length; i++) {
                const point = trailPoints[i];
                const age = now - point.timestamp;
                const opacity = 1 - (age / trailMaxAge);
                ctx.beginPath();
                ctx.moveTo(point.x, point.y);
                ctx.lineTo(point.prevX, point.prevY);
                ctx.lineTo(centerX, centerY);
                ctx.closePath();
                ctx.fillStyle = `rgba(255, 0, 0, ${opacity * 0.3})`;
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(point.x, point.y);
                ctx.lineTo(point.prevX, point.prevY);
                ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.7})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        window.updateWithBeamNGData = function(data) {
            if (!data) return;
            const rpmPercentage = Math.min((data.rpm / 8000) * 100, 100);
            updateRpmGauges(rpmPercentage);
            updateGear(data.gear);
            updateSpeed(data.wheelspeed);
            if (data.speedLimit !== undefined) updateSpeedLimit(data.speedLimit);
            if (data.engineMode) updateMode('engine', data.engineMode);
            if (data.suspensionMode) updateMode('suspension', data.suspensionMode);
            if (data.steeringMode) updateMode('steering', data.steeringMode);
            if (data.brakeMode) updateMode('brake', data.brakeMode);
            if (data.transfercase_state !== undefined) updateTransferCase(data.transfercase_state);
            if (data.accelerationData) {
                const gForceX = data.accelerationData.xSmooth / 9.81;
                const gForceY = data.accelerationData.ySmooth / 9.81;
                updateGForceMeter(gForceX, gForceY);
            }
            if (data.outsideTemp !== undefined) updateOutsideTemp(data.outsideTemp);
            updateIndicators({
                signal_L: data.signal_L || 0,
                signal_R: data.signal_R || 0,
                lights_state: data.lights_state || 0,
                highbeam: data.highbeam || 0,
                checkengine: data.checkengine || 0
            });
        };

        window.setup = function(data) {
            unit = data.uiUnitLength || 'metric'; // Default to metric if undefined
            speedUnit.textContent = unit === "metric" ? "km/h" : "mph";
            if (data.wheelspeed) {
                updateSpeed(data.wheelspeed);
            }
        };

        // Initialize
        updateRpmGauges(0);
        updateGear(-2);
        updateSpeed(0);
        updateSpeedLimit(null);
        updateMode('engine', 'comfort');
        updateMode('suspension', 'comfort');
        updateMode('steering', 'comfort');
        updateMode('brake', 'comfort');
        updateOutsideTemp(20.5);
        updateTransferCase(0.33);
        updateTime();
        setInterval(updateTime, 1000);
    </script>
